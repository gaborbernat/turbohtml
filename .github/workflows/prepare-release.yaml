name: 🛠️ Prepare release
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump type
        required: true
        type: choice
        options: [auto, major, minor, patch]
        default: auto
permissions:
  contents: read
env:
  FORCE_COLOR: "1"
jobs:
  prepare-release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: release-auth
    permissions:
      contents: read
    steps:
      - id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history so git describe sees the latest tag
          token: ${{ steps.token.outputs.token }}
          persist-credentials: true # zizmor: ignore[artipacked] the release script pushes main and its tag
      - name: 🔄 Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.15"
          enable-cache: false
          cache-dependency-glob: pyproject.toml
      - name: 🔧 Configure git
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          APP_SLUG: ${{ steps.token.outputs.app-slug }}
        run: |
          app_user_id=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${app_user_id}+${APP_SLUG}[bot]@users.noreply.github.com"
      - name: 🔢 Calculate next version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          current=$(git describe --tags --abbrev=0 2>/dev/null || echo "0.0.0")
          IFS='.' read -r major minor patch <<< "$current"
          bump_type="$BUMP"
          if [ "$bump_type" = "auto" ]; then
            if [ "$(find docs/changelog -name '*.feature.rst' 2>/dev/null | wc -l)" -gt 0 ]; then
              bump_type="minor"
            else
              bump_type="patch"
            fi
          fi
          case "$bump_type" in
            major) next="$((major + 1)).0.0" ;;
            minor) next="$major.$((minor + 1)).0" ;;
            patch) next="$major.$minor.$((patch + 1))" ;;
          esac
          echo "Next version: $next"
          echo "version=$next" >> "$GITHUB_OUTPUT"
      - name: Require a news fragment
        run: |
          if ! compgen -G 'docs/changelog/*.*.rst' > /dev/null; then
            echo '::error::add a docs/changelog/*.rst fragment before preparing a release'
            exit 1
          fi
      - name: 🚀 Run the release
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: uvx --with tox-uv tox run -e release -- "$VERSION"
